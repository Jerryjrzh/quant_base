<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MA指标调试测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .debug-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        .error { color: red; }
        .success { color: green; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>MA指标调试测试</h1>
    
    <div class="debug-section">
        <h3>测试步骤</h3>
        <button onclick="testAPI()">测试API调用</button>
        <button onclick="testMAData()">测试MA数据</button>
        <div id="test-results"></div>
    </div>

    <div class="debug-section">
        <h3>API响应数据</h3>
        <pre id="api-response"></pre>
    </div>

    <div class="debug-section">
        <h3>MA指标数据</h3>
        <pre id="ma-data"></pre>
    </div>

    <script>
        async function testAPI() {
            const resultsDiv = document.getElementById('test-results');
            const responseDiv = document.getElementById('api-response');
            
            try {
                resultsDiv.innerHTML = '<p>正在测试API...</p>';
                
                // 先获取策略列表
                const strategiesResponse = await fetch('/api/strategies');
                if (!strategiesResponse.ok) {
                    throw new Error('无法获取策略列表');
                }
                const strategies = await strategiesResponse.json();
                console.log('策略列表:', strategies);
                
                if (!strategies.success || strategies.data.length === 0) {
                    throw new Error('没有可用的策略');
                }
                
                const firstStrategy = strategies.data[0];
                resultsDiv.innerHTML += `<p class="success">找到策略: ${firstStrategy}</p>`;
                
                // 获取该策略的股票列表
                const stocksResponse = await fetch(`/api/strategies/${encodeURIComponent(firstStrategy)}/stocks`);
                if (!stocksResponse.ok) {
                    throw new Error('无法获取股票列表');
                }
                const stocks = await stocksResponse.json();
                console.log('股票列表:', stocks);
                
                if (!stocks.success || stocks.data.length === 0) {
                    throw new Error('该策略没有股票');
                }
                
                const firstStock = stocks.data[0].stock_code;
                resultsDiv.innerHTML += `<p class="success">找到股票: ${firstStock}</p>`;
                
                // 测试统一分析API
                const analysisResponse = await fetch(`/api/unified_analysis/${firstStock}?strategy=${encodeURIComponent(firstStrategy)}`);
                if (!analysisResponse.ok) {
                    const errorText = await analysisResponse.text();
                    throw new Error(`API调用失败: ${analysisResponse.status} - ${errorText}`);
                }
                
                const analysisData = await analysisResponse.json();
                console.log('分析数据:', analysisData);
                
                responseDiv.textContent = JSON.stringify(analysisData, null, 2);
                
                if (analysisData.success) {
                    resultsDiv.innerHTML += `<p class="success">API调用成功!</p>`;
                    return analysisData;
                } else {
                    throw new Error(analysisData.error || '未知错误');
                }
                
            } catch (error) {
                console.error('API测试失败:', error);
                resultsDiv.innerHTML += `<p class="error">API测试失败: ${error.message}</p>`;
                responseDiv.textContent = error.message;
                return null;
            }
        }
        
        async function testMAData() {
            const maDataDiv = document.getElementById('ma-data');
            
            try {
                const data = await testAPI();
                if (!data || !data.success) {
                    throw new Error('无法获取API数据');
                }
                
                const chartData = data.data.chart_data;
                if (!chartData || !chartData.indicator_data) {
                    throw new Error('图表数据不存在');
                }
                
                // 检查MA指标数据
                const indicatorData = chartData.indicator_data;
                const maFields = ['ma7', 'ma13', 'ma30', 'ma45', 'ma60', 'ma90', 'ma150', 'ma240'];
                
                let maInfo = '=== MA指标数据检查 ===\n';
                maInfo += `总数据点数: ${indicatorData.length}\n\n`;
                
                maFields.forEach(field => {
                    const values = indicatorData.map(item => item[field]).filter(v => v !== null && v !== undefined && !isNaN(v));
                    maInfo += `${field.toUpperCase()}: ${values.length > 0 ? '✓' : '✗'} (有效数据点: ${values.length})\n`;
                    if (values.length > 0) {
                        maInfo += `  最新值: ${values[values.length - 1]?.toFixed(2) || 'N/A'}\n`;
                        maInfo += `  范围: ${Math.min(...values).toFixed(2)} - ${Math.max(...values).toFixed(2)}\n`;
                    }
                    maInfo += '\n';
                });
                
                // 检查前几个数据点的详细信息
                maInfo += '=== 前5个数据点详情 ===\n';
                for (let i = 0; i < Math.min(5, indicatorData.length); i++) {
                    const item = indicatorData[i];
                    maInfo += `数据点 ${i + 1} (${item.date || 'N/A'}):\n`;
                    maFields.forEach(field => {
                        maInfo += `  ${field}: ${item[field] || 'N/A'}\n`;
                    });
                    maInfo += '\n';
                }
                
                maDataDiv.textContent = maInfo;
                
            } catch (error) {
                console.error('MA数据测试失败:', error);
                maDataDiv.textContent = `MA数据测试失败: ${error.message}`;
            }
        }
        
        // 页面加载时自动运行测试
        window.addEventListener('load', () => {
            console.log('页面加载完成，开始自动测试...');
            setTimeout(testAPI, 1000);
        });
    </script>
</body>
</html>
