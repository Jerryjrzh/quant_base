<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Debug Test</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
</head>
<body>
    <div id="chart" style="width: 800px; height: 600px;"></div>
    <div id="debug-info"></div>

    <script>
        // Initialize ECharts
        const myChart = echarts.init(document.getElementById('chart'));
        
        // Test the unified API call
        async function testUnifiedAPI() {
            const debugInfo = document.getElementById('debug-info');
            
            try {
                debugInfo.innerHTML = 'Loading data...';
                
                const response = await fetch('/api/unified_analysis/sh600036?strategy=PRE_CROSS');
                const result = await response.json();
                
                debugInfo.innerHTML += '<br>API Response received';
                console.log('API Response:', result);
                
                if (!result.success) {
                    throw new Error(result.error);
                }

                const unifiedData = result.data;
                debugInfo.innerHTML += '<br>Data extracted';
                
                // Check the data structure
                console.log('Unified Data:', unifiedData);
                console.log('Chart Data:', unifiedData.chart_data);
                
                if (!unifiedData.chart_data) {
                    throw new Error('No chart_data in response');
                }
                
                if (!unifiedData.chart_data.kline_data || !unifiedData.chart_data.indicator_data) {
                    throw new Error('Missing kline_data or indicator_data');
                }
                
                debugInfo.innerHTML += '<br>Data validation passed';
                
                // Try to render the chart
                renderEchart(unifiedData.chart_data, 'sh600036', 'PRE_CROSS', unifiedData.stock_name);
                
                debugInfo.innerHTML += '<br>Chart rendered successfully';
                
            } catch (error) {
                console.error('Error:', error);
                debugInfo.innerHTML += '<br>Error: ' + error.message;
            }
        }
        
        // Simplified renderEchart function for testing
        function renderEchart(chartData, stockCode, strategy, stockName) {
            console.log('renderEchart called with:', {
                chartData: chartData,
                stockCode: stockCode,
                strategy: strategy,
                stockName: stockName
            });
            
            try {
                const dates = chartData.kline_data.map(item => item.date);
                const klineData = chartData.kline_data.map(item => [item.open, item.close, item.low, item.high]);
                
                console.log('Dates length:', dates.length);
                console.log('KLine data length:', klineData.length);
                
                // Test indicator data
                const ma13Data = chartData.indicator_data.map(item => item.ma13);
                const ma45Data = chartData.indicator_data.map(item => item.ma45);
                
                console.log('MA13 data sample:', ma13Data.slice(0, 10));
                console.log('MA45 data sample:', ma45Data.slice(0, 10));
                
                // Simple chart configuration
                const option = {
                    title: {
                        text: stockName + ' (' + stockCode + ')'
                    },
                    xAxis: {
                        type: 'category',
                        data: dates.slice(-100) // Show last 100 days
                    },
                    yAxis: {
                        type: 'value'
                    },
                    series: [{
                        name: 'Close Price',
                        type: 'line',
                        data: klineData.slice(-100).map(item => item[1]) // Close prices
                    }]
                };
                
                myChart.setOption(option);
                console.log('Chart option set successfully');
                
            } catch (error) {
                console.error('Error in renderEchart:', error);
                throw error;
            }
        }
        
        // Start the test
        testUnifiedAPI();
    </script>
</body>
</html>
