<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MA13策略前端测试</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #dee2e6;
            border-radius: 8px;
        }
        .result-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <h1>MA13策略前端功能测试</h1>
        
        <div class="test-section">
            <h3>1. 获取所有股票代码测试</h3>
            <button class="btn btn-primary" onclick="testGetAllStocks()">测试获取股票代码</button>
            <div id="stockCodesResult" class="result-box" style="display: none;"></div>
        </div>
        
        <div class="test-section">
            <h3>2. 全市场扫描测试</h3>
            <div class="mb-3">
                <label for="testMaxStocks" class="form-label">测试扫描数量</label>
                <select class="form-select" id="testMaxStocks">
                    <option value="5">5只（快速测试）</option>
                    <option value="10" selected>10只</option>
                    <option value="20">20只</option>
                </select>
            </div>
            <button class="btn btn-success" onclick="testFullMarketScan()">测试全市场扫描</button>
            <div id="scanResult" class="result-box" style="display: none;"></div>
        </div>
        
        <div class="test-section">
            <h3>3. 单股分析测试</h3>
            <div class="mb-3">
                <label for="testStockCode" class="form-label">股票代码</label>
                <input type="text" class="form-control" id="testStockCode" value="sz002021">
            </div>
            <button class="btn btn-info" onclick="testSingleStock()">测试单股分析</button>
            <div id="singleResult" class="result-box" style="display: none;"></div>
        </div>
        
        <div class="test-section">
            <h3>4. 批量扫描结果显示测试</h3>
            <button class="btn btn-warning" onclick="testDisplayBatchResults()">测试结果显示</button>
            
            <!-- 批量扫描结果显示区域 -->
            <div class="row result-section" id="batchResult" style="display: none;">
                <div class="col-12">
                    <div class="card">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h5><i class="fas fa-list-check"></i> 批量扫描结果</h5>
                            <span id="batchSummary" class="badge bg-info fs-6"></span>
                        </div>
                        <div class="card-body">
                            <div id="batchResults"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function testGetAllStocks() {
            const resultDiv = document.getElementById('stockCodesResult');
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<div class="spinner-border" role="status"><span class="visually-hidden">Loading...</span></div>';
            
            try {
                const response = await fetch('/api/ma13/all_stocks');
                const result = await response.json();
                
                if (result.success) {
                    const codes = result.stock_codes || [];
                    resultDiv.innerHTML = `
                        <h5>✅ 获取成功</h5>
                        <p><strong>总股票数:</strong> ${result.total_count}</p>
                        <p><strong>过滤后数量:</strong> ${result.filtered_count}</p>
                        <p><strong>返回数量:</strong> ${codes.length}</p>
                        <p><strong>前20个代码:</strong> ${codes.slice(0, 20).join(', ')}</p>
                    `;
                } else {
                    resultDiv.innerHTML = `<div class="alert alert-danger">❌ 失败: ${result.message}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="alert alert-danger">❌ 错误: ${error.message}</div>`;
            }
        }
        
        async function testFullMarketScan() {
            const maxStocks = document.getElementById('testMaxStocks').value;
            const resultDiv = document.getElementById('scanResult');
            
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<div class="spinner-border" role="status"><span class="visually-hidden">扫描中...</span></div> 正在扫描，请稍候...';
            
            try {
                const response = await fetch('/api/ma13/full_market_scan', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        max_stocks: parseInt(maxStocks),
                        days: 150
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    const summary = result.summary || {};
                    const stats = result.scan_stats || {};
                    
                    resultDiv.innerHTML = `
                        <h5>✅ 扫描完成</h5>
                        <div class="row">
                            <div class="col-md-6">
                                <h6>扫描统计</h6>
                                <p><strong>总股票数:</strong> ${stats.total_stocks}</p>
                                <p><strong>实际扫描:</strong> ${stats.processed_stocks}</p>
                                <p><strong>符合条件:</strong> ${stats.qualified_stocks}</p>
                                <p><strong>符合率:</strong> ${((stats.qualified_stocks || 0) / (stats.processed_stocks || 1) * 100).toFixed(1)}%</p>
                            </div>
                            <div class="col-md-6">
                                <h6>符合条件的股票</h6>
                                ${summary.top_candidates ? summary.top_candidates.slice(0, 5).map(stock => 
                                    `<p>${stock.stock_code} - 信心度: ${stock.summary?.confidence || 0}%</p>`
                                ).join('') : '<p>无符合条件的股票</p>'}
                            </div>
                        </div>
                        <button class="btn btn-primary mt-2" onclick="displayBatchResults(${JSON.stringify(result).replace(/"/g, '&quot;')})">显示详细结果</button>
                    `;
                } else {
                    resultDiv.innerHTML = `<div class="alert alert-danger">❌ 扫描失败: ${result.message}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="alert alert-danger">❌ 错误: ${error.message}</div>`;
            }
        }
        
        async function testSingleStock() {
            const stockCode = document.getElementById('testStockCode').value;
            const resultDiv = document.getElementById('singleResult');
            
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<div class="spinner-border" role="status"><span class="visually-hidden">分析中...</span></div>';
            
            try {
                const response = await fetch('/api/ma13/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        stock_code: stockCode,
                        days: 150
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    const recommendation = result.recommendation || {};
                    resultDiv.innerHTML = `
                        <h5>✅ 分析成功</h5>
                        <p><strong>股票代码:</strong> ${result.stock_code}</p>
                        <p><strong>操作建议:</strong> ${recommendation.action || 'wait'}</p>
                        <p><strong>信心度:</strong> ${recommendation.confidence || 0}%</p>
                        <p><strong>建议仓位:</strong> ${((recommendation.position_size || 0) * 100).toFixed(0)}%</p>
                        <p><strong>风险收益比:</strong> 1:${recommendation.risk_reward_ratio || 0}</p>
                    `;
                } else {
                    resultDiv.innerHTML = `<div class="alert alert-warning">⚠️ 不符合条件: ${result.message}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="alert alert-danger">❌ 错误: ${error.message}</div>`;
            }
        }
        
        function testDisplayBatchResults() {
            // 创建模拟数据测试显示功能
            const mockResult = {
                success: true,
                summary: {
                    total_scanned: 10,
                    qualified_count: 3,
                    qualified_rate: 30.0
                },
                results: [
                    {
                        stock_code: 'sz002021',
                        success: true,
                        current_price: 15.68,
                        summary: {
                            action: 'buy_heavy',
                            confidence: 85,
                            signal_strength: 78
                        }
                    },
                    {
                        stock_code: 'sh600000',
                        success: true,
                        current_price: 12.34,
                        summary: {
                            action: 'buy_light',
                            confidence: 65,
                            signal_strength: 55
                        }
                    },
                    {
                        stock_code: 'sz000001',
                        success: false,
                        message: '不符合MA13回调条件'
                    }
                ]
            };
            
            displayBatchResults(mockResult);
        }
        
        // 从MA13策略页面复制的displayBatchResults函数
        function displayBatchResults(result) {
            document.getElementById('batchResult').style.display = 'block';
            
            const summary = result.summary || {};
            document.getElementById('batchSummary').textContent = 
                `${summary.qualified_count || 0}/${summary.total_scanned || 0} 符合条件 (${(summary.qualified_rate || 0).toFixed(1)}%)`;

            const container = document.getElementById('batchResults');
            const results = result.results || [];

            let html = '';
            results.forEach(item => {
                const qualified = item.success || false;
                const itemClass = qualified ? 'batch-result-qualified' : 'batch-result-unqualified';
                const summary = item.summary || {};

                html += `
                    <div class="batch-result-item ${itemClass}" style="border: 1px solid #dee2e6; border-radius: 8px; padding: 15px; margin-bottom: 10px;">
                        <div class="row align-items-center">
                            <div class="col-md-2">
                                <strong>${item.stock_code || ''}</strong>
                                ${qualified ? '<span class="badge bg-success ms-2">符合</span>' : '<span class="badge bg-danger ms-2">不符合</span>'}
                            </div>
                            <div class="col-md-2">
                                <small class="text-muted">当前价格</small><br>
                                <strong>${item.current_price ? item.current_price.toFixed(2) + '元' : 'N/A'}</strong>
                            </div>
                            <div class="col-md-2">
                                <small class="text-muted">操作建议</small><br>
                                <span class="badge ${summary.action === 'buy_heavy' ? 'bg-success' : summary.action === 'buy_light' ? 'bg-warning' : 'bg-secondary'}">
                                    ${summary.action === 'buy_heavy' ? '重仓' : summary.action === 'buy_light' ? '轻仓' : '观望'}
                                </span>
                            </div>
                            <div class="col-md-2">
                                <small class="text-muted">信心度</small><br>
                                <strong>${summary.confidence || 0}%</strong>
                            </div>
                            <div class="col-md-2">
                                <small class="text-muted">信号强度</small><br>
                                <strong>${summary.signal_strength || 0}</strong>
                            </div>
                            <div class="col-md-2">
                                <small class="text-muted">状态</small><br>
                                <small class="text-muted">${qualified ? '策略匹配' : (item.message || '不符合条件')}</small>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }
    </script>
</body>
</html>
