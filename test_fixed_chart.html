<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>修复后的图表测试</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.0/dist/echarts.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .controls { margin: 20px 0; }
        button { margin: 5px; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        #chart-container { width: 100%; height: 600px; border: 1px solid #ddd; margin: 20px 0; }
        .log { margin: 10px 0; padding: 10px; background: #f5f5f5; font-family: monospace; white-space: pre-wrap; max-height: 200px; overflow-y: auto; }
        select { padding: 5px; margin: 5px; }
    </style>
</head>
<body>
    <h1>修复后的图表测试</h1>
    
    <div class="controls">
        <label for="strategy-select">策略:</label>
        <select id="strategy-select">
            <option value="WEEKLY_GOLDEN_CROSS_MA">周线金叉+日线MA策略</option>
        </select>
        
        <label for="stock-select">股票:</label>
        <select id="stock-select">
            <option value="">请选择股票</option>
            <option value="sh600006">sh600006</option>
            <option value="sz000001">sz000001</option>
        </select>
        
        <button onclick="testChart()">测试图表</button>
        <button onclick="clearChart()">清空图表</button>
    </div>
    
    <div id="chart-container"></div>
    <div class="log" id="log">等待测试...</div>

    <script src="fix_frontend_chart.js"></script>
    <script>
        const logDiv = document.getElementById('log');
        
        function log(message) {
            console.log(message);
            logDiv.textContent += new Date().toLocaleTimeString() + ': ' + message + '\n';
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        // 重写console.log以便在页面上显示
        const originalLog = console.log;
        console.log = function(...args) {
            originalLog.apply(console, args);
            log(args.join(' '));
        };
        
        const originalError = console.error;
        console.error = function(...args) {
            originalError.apply(console, args);
            log('ERROR: ' + args.join(' '));
        };
        
        async function testChart() {
            log('开始测试图表...');
            
            const stockSelect = document.getElementById('stock-select');
            const strategySelect = document.getElementById('strategy-select');
            
            if (!stockSelect.value) {
                log('请先选择股票');
                return;
            }
            
            // 调用修复后的函数
            if (window.loadUnifiedStockDataFixed) {
                await window.loadUnifiedStockDataFixed();
            } else {
                log('修复函数未找到');
            }
        }
        
        function clearChart() {
            if (window.myChart) {
                window.myChart.clear();
                log('图表已清空');
            } else {
                log('图表实例不存在');
            }
        }
        
        // 股票选择变化时自动测试
        document.getElementById('stock-select').addEventListener('change', function() {
            if (this.value) {
                setTimeout(testChart, 100);
            }
        });
        
        log('页面初始化完成');
    </script>
</body>
</html>
