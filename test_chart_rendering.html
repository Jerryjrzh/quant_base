<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图表渲染测试</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.0/dist/echarts.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #chart-container { width: 100%; height: 600px; border: 1px solid #ddd; }
        .controls { margin: 20px 0; }
        button { margin: 5px; padding: 10px; }
        .status { margin: 10px 0; padding: 10px; background: #f5f5f5; }
    </style>
</head>
<body>
    <h1>图表渲染测试</h1>
    
    <div class="controls">
        <button onclick="testChartRendering()">测试图表渲染</button>
        <button onclick="clearChart()">清空图表</button>
    </div>
    
    <div class="status" id="status">等待测试...</div>
    
    <div id="chart-container"></div>

    <script>
        const myChart = echarts.init(document.getElementById('chart-container'));
        
        async function testChartRendering() {
            const statusDiv = document.getElementById('status');
            
            try {
                statusDiv.innerHTML = '正在获取数据...';
                
                // 获取测试数据
                const response = await fetch('/api/unified_analysis/sh600006?strategy=WEEKLY_GOLDEN_CROSS_MA');
                if (!response.ok) {
                    throw new Error(`API调用失败: ${response.status}`);
                }
                
                const result = await response.json();
                if (!result.success) {
                    throw new Error(result.error || '未知错误');
                }
                
                statusDiv.innerHTML = '数据获取成功，正在渲染图表...';
                
                const chartData = result.data.chart_data;
                renderTestChart(chartData);
                
                statusDiv.innerHTML = '图表渲染完成！';
                
            } catch (error) {
                console.error('测试失败:', error);
                statusDiv.innerHTML = `测试失败: ${error.message}`;
            }
        }
        
        function renderTestChart(chartData) {
            const dates = chartData.kline_data.map(item => item.date);
            const klineData = chartData.kline_data.map(item => [item.open, item.close, item.low, item.high]);
            
            // 提取MA数据
            const ma7Data = chartData.indicator_data.map(item => item.ma7);
            const ma13Data = chartData.indicator_data.map(item => item.ma13);
            const ma30Data = chartData.indicator_data.map(item => item.ma30);
            const ma45Data = chartData.indicator_data.map(item => item.ma45);
            const ma60Data = chartData.indicator_data.map(item => item.ma60);
            const ma90Data = chartData.indicator_data.map(item => item.ma90);
            const ma150Data = chartData.indicator_data.map(item => item.ma150);
            const ma240Data = chartData.indicator_data.map(item => item.ma240);
            
            console.log('数据检查:');
            console.log('日期数量:', dates.length);
            console.log('K线数据数量:', klineData.length);
            console.log('MA7有效数据:', ma7Data.filter(v => v !== null && v !== undefined).length);
            console.log('MA13有效数据:', ma13Data.filter(v => v !== null && v !== undefined).length);
            console.log('MA240有效数据:', ma240Data.filter(v => v !== null && v !== undefined).length);
            
            const option = {
                title: {
                    text: 'MA指标测试图表',
                    left: 'center'
                },
                tooltip: {
                    trigger: 'axis',
                    axisPointer: { type: 'cross' }
                },
                legend: {
                    data: ['K线', 'MA7', 'MA13', 'MA30', 'MA45', 'MA60', 'MA90', 'MA150', 'MA240'],
                    top: 30
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    data: dates,
                    boundaryGap: false
                },
                yAxis: {
                    type: 'value',
                    scale: true
                },
                dataZoom: [
                    {
                        type: 'inside',
                        start: 80,
                        end: 100
                    },
                    {
                        show: true,
                        type: 'slider',
                        bottom: 10,
                        start: 80,
                        end: 100
                    }
                ],
                series: [
                    {
                        name: 'K线',
                        type: 'candlestick',
                        data: klineData
                    },
                    {
                        name: 'MA7',
                        type: 'line',
                        data: ma7Data,
                        smooth: true,
                        symbol: 'none',
                        lineStyle: { width: 1, color: '#ff6b6b' }
                    },
                    {
                        name: 'MA13',
                        type: 'line',
                        data: ma13Data,
                        smooth: true,
                        symbol: 'none',
                        lineStyle: { width: 1, color: '#4ecdc4' }
                    },
                    {
                        name: 'MA30',
                        type: 'line',
                        data: ma30Data,
                        smooth: true,
                        symbol: 'none',
                        lineStyle: { width: 1, color: '#45b7d1' }
                    },
                    {
                        name: 'MA45',
                        type: 'line',
                        data: ma45Data,
                        smooth: true,
                        symbol: 'none',
                        lineStyle: { width: 1, color: '#f39c12' }
                    },
                    {
                        name: 'MA60',
                        type: 'line',
                        data: ma60Data,
                        smooth: true,
                        symbol: 'none',
                        lineStyle: { width: 1, color: '#e74c3c' }
                    },
                    {
                        name: 'MA90',
                        type: 'line',
                        data: ma90Data,
                        smooth: true,
                        symbol: 'none',
                        lineStyle: { width: 1, color: '#9b59b6' }
                    },
                    {
                        name: 'MA150',
                        type: 'line',
                        data: ma150Data,
                        smooth: true,
                        symbol: 'none',
                        lineStyle: { width: 1, color: '#2ecc71' }
                    },
                    {
                        name: 'MA240',
                        type: 'line',
                        data: ma240Data,
                        smooth: true,
                        symbol: 'none',
                        lineStyle: { width: 1, color: '#e67e22' }
                    }
                ]
            };
            
            myChart.setOption(option, true);
        }
        
        function clearChart() {
            myChart.clear();
            document.getElementById('status').innerHTML = '图表已清空';
        }
    </script>
</body>
</html>
